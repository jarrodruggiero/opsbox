# Checks for every pull request: the release script's tests, and the image
# built and tested on both architectures it ships for.
#
# Public-repository workflow: GitHub-hosted runners, public actions pinned to
# commits, and nothing that reaches private infrastructure. The arm64 leg runs
# on GitHub's arm64 runner rather than under QEMU, because the image runs
# every tool once while it builds, Claude Code's binary included, and an
# emulator is not the place to find out whether that works.
name: CI

on:
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run still going for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tests/test_image.py skips itself here: it needs OPSBOX_IMAGE, which
      # only the image job sets.
      - name: Run the tests
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes -r requirements-dev.txt
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q tests

  image:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # The release preview reads the last release's image, which works
      # before the package has been made public too.
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag, for the release preview's "last release".
          fetch-depth: 0
          persist-credentials: false
      # BuildKit is pinned and bumped by hand, since Dependabot doesn't read
      # images given to an action. The Dockerfile names Docker Hub images as
      # docker.io/..., so Dependabot sees Docker Hub's full tag list, while the
      # pulls themselves go through mirror.gcr.io: Docker Hub rate-limits
      # GitHub's shared runners.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      # The build ends by running opsbox-versions, so getting past this step
      # means every tool has run once on this architecture.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: opsbox:ci
          # Cached between runs, unlike a release: a stale gh or Claude Code
          # here costs nothing, and the release builds from scratch anyway.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Lint the shell scripts
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src opsbox:ci shellcheck \
            rootfs/usr/local/bin/opsbox-entrypoint scripts/*.sh

      - name: Test the image
        env:
          OPSBOX_IMAGE: opsbox:ci
          OPSBOX_REQUIRE_IMAGE: "1"
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes -r requirements-dev.txt
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q tests/test_image.py

      - name: Log in to ghcr.io
        if: matrix.arch == 'amd64'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What merging this pull request would release, worked out the way the
      # release does it. Information only: it fails when the last release's
      # image can't be read, and must never block a merge.
      - name: Release preview
        if: matrix.arch == 'amd64'
        continue-on-error: true
        run: |
          notes="$RUNNER_TEMP/notes.md"
          version=$(scripts/plan-release.sh --notes "$notes" opsbox:ci "ghcr.io/${GITHUB_REPOSITORY,,}")
          {
            echo "## Merging this releases ${version:-nothing}"
            echo
            if [ -n "$version" ]; then cat "$notes"; fi
          } >> "$GITHUB_STEP_SUMMARY"
