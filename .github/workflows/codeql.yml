# CodeQL code scanning, free on a public repository. Here it reads the
# workflows (unsafe expressions, untrusted checkouts, unpinned actions) and the
# Python scripts. Alerts go to the Security tab, which only people with write
# access can see.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly as well: the queries improve, so untouched code can gain an alert.
    - cron: "22 10 * * 4"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload the results
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none # nothing here is compiled
          # A finding in a test is not a finding in what ships.
          config: |
            queries:
              - uses: security-extended
            paths-ignore:
              - tests

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
