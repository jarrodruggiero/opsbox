# Publish a new image whenever what is in it changes, with a version that says
# how much changed.
#
# Runs on every push to main (any merged pull request, Dependabot's included),
# weekly, and by hand. The weekly run is what ships the tools Dependabot cannot
# see: gh, Claude Code, Helm and the Debian packages install their newest
# version at build time, so a release can carry updates with no new commit.
#
# How the version is chosen is scripts/next-version.py's job (the rules are in
# its docstring); scripts/plan-release.sh feeds it the candidate image's
# versions.txt and the last release's. Nothing here decides anything, so the
# same scripts work on another CI system.
#
# Order matters: the image is tagged before the git tag and the GitHub release
# exist. A run that fails part way leaves no tag, so the next run works out the
# same version and finishes the job. A git tag pointing at no image cannot
# happen.
name: Release

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 20 * * 0" # Mondays 07:00 in Melbourne (AEDT)
  workflow_dispatch:

permissions:
  contents: read

# Never let two runs race the version calculation or the tags.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Is a release due? Builds amd64 locally and compares it with the last release.
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read # the last release's image, even before the package is public
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag, to find the last release
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No cache, here or in `build`: a cached layer would keep last week's gh,
      # Claude Code, Helm and Debian packages, and the weekly run would never see
      # an update.
      - name: Build the candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          no-cache: true
          pull: true
          tags: opsbox:candidate
      # Never publish an image whose tests fail, even though CI usually ran them
      # on this commit already: the floating tools may have moved since.
      - name: Test the candidate
        env:
          OPSBOX_IMAGE: opsbox:candidate
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes -r requirements-dev.txt
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q tests
      - name: Plan
        id: plan
        run: |
          notes="$RUNNER_TEMP/notes.md"
          version=$(scripts/plan-release.sh --notes "$notes" opsbox:candidate "ghcr.io/${GITHUB_REPOSITORY,,}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "## ${version:-No release due}"
            echo
            if [ -n "$version" ]; then cat "$notes"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Each architecture on its own native runner, pushed by digest with no tags:
  # nothing can pull it by name until `publish` has checked it.
  build:
    needs: plan
    if: needs.plan.outputs.version != ''
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Labels only. The version label carries the plan's number. `publish`
      # works the number out again from this build, and in the rare case
      # that a floating tool's update lands between the two builds, the tag
      # wins over the label.
      - name: Image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}},value=${{ needs.plan.outputs.version }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          no-cache: true
          pull: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
      # The image just pushed, on its own architecture, before anything tags it.
      - name: Test the pushed image
        env:
          OPSBOX_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes -r requirements-dev.txt
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q tests/test_image.py
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  # Join the two architectures under the version's tags, then cut the release.
  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the tag and the GitHub release
      packages: write # the image's tags
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version again, from the amd64 image that was actually pushed, so the
      # notes describe what ships rather than what `plan` built minutes earlier.
      - name: Version and notes from the pushed image
        id: version
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          notes="$RUNNER_TEMP/notes.md"
          version=$(scripts/plan-release.sh --notes "$notes" "$image@$(cat "$RUNNER_TEMP/digests/amd64")" "$image")
          if [ -z "$version" ]; then
            echo "::error::plan found a release due, but the pushed image matches the last release"
            exit 1
          fi
          docker run --rm "$image@$(cat "$RUNNER_TEMP/digests/amd64")" \
            cat /usr/local/share/opsbox/versions.txt > "$RUNNER_TEMP/versions.txt"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # v1.2.3 publishes 1.2.3, 1.2, 1 and latest. Releases only ever move
      # forward from main, so each one is the newest of its line.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}

      - name: Tag the image
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          docker buildx imagetools create "${args[@]}" "$image@$(cat amd64)" "$image@$(cat arm64)"
          docker buildx imagetools inspect "$image:${{ steps.meta.outputs.version }}"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/versions.txt"
