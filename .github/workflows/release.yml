# Publish a new image whenever what is in it changes, with a version that says
# how much changed.
#
# Runs on every push to main (any merged pull request, Dependabot's included),
# weekly, and by hand. The weekly run is what ships the tools Dependabot cannot
# see: gh, Claude Code, Helm and the Debian packages install their newest
# version at build time, so a release can carry updates with no new commit.
#
# How the version is chosen is scripts/next-version.py's job (the rules are in
# its docstring); scripts/plan-release.sh feeds it the candidate image's
# versions.txt and the last release's. Nothing here decides anything, so the
# same scripts work on another CI system.
#
# Order matters: the image is tagged before the git tag and the GitHub release
# exist, so a git tag pointing at no image can't happen. A published X.Y.Z is
# never replaced, so a publish that fails after tagging costs that number:
# scripts/plan-release.sh skips a version that already has an image, and the
# next run takes the one after it.
#
# Only main's newest commit is released. GitHub refuses a release at a commit
# whose workflow files differ from main's unless the token may change workflows,
# which GITHUB_TOKEN never can, so a merge while a run builds could fail that
# run after it tagged the image. The next run on main carries both, the weekly
# one at the latest.
name: Release

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 20 * * 0" # Mondays 07:00 in Melbourne (AEDT)
  workflow_dispatch:

permissions:
  contents: read

# Never let two runs race the version calculation or the tags.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Is a release due? Builds amd64 locally and compares it with the last release.
  plan:
    # Releases come from main only. A dispatch on another branch would publish
    # unreviewed code as `latest` and tag a commit main never descends from.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read # the last release's image, even before the package is public
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag, to find the last release
          persist-credentials: false
      # BuildKit is pinned and bumped by hand, since Dependabot doesn't read
      # images given to an action. The Dockerfile names Docker Hub images as
      # docker.io/..., so Dependabot sees Docker Hub's full tag list, while the
      # pulls themselves go through mirror.gcr.io: Docker Hub rate-limits
      # GitHub's shared runners.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No cache, here or in `build`: a cached layer would keep last week's gh,
      # Claude Code, Helm and Debian packages, and the weekly run would never see
      # an update.
      - name: Build the candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          no-cache: true
          pull: true
          tags: opsbox:candidate
      # Never publish an image whose tests fail, even though CI usually ran them
      # on this commit already: the floating tools may have moved since.
      - name: Test the candidate
        env:
          OPSBOX_IMAGE: opsbox:candidate
          OPSBOX_REQUIRE_IMAGE: "1"
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes -r requirements-dev.txt
          # Not the page's layout tests: a Chrome or font change on the runner
          # must not hold back a release, the weekly security rebuild included.
          # CI runs them on every pull request.
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q tests --ignore=tests/manager/test_visual.py
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          version=$(scripts/plan-release.sh --only-if-newest --notes "$notes" opsbox:candidate "ghcr.io/${GITHUB_REPOSITORY,,}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "## ${version:-No release from this run}"
            echo
            if [ -n "$version" ]; then cat "$notes"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Each architecture on its own native runner, pushed by digest with no tags:
  # nothing can pull it by name until `publish` has checked it.
  build:
    needs: plan
    if: needs.plan.outputs.version != ''
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Labels only. The version label carries the plan's number. `publish`
      # works the number out again from this build, and in the rare case that
      # the two differ, because a floating tool's update landed between the two
      # builds or a re-run took a later number, the tag wins over the label.
      - name: Image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}},value=${{ needs.plan.outputs.version }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          no-cache: true
          pull: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          # Written, never read here: pull requests can restore a cache from
          # main, so their builds start warm.
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      # The image just pushed, on its own architecture, before anything tags it.
      # Pulled first, so the first test's timeout isn't spent downloading it.
      - name: Test the pushed image
        env:
          OPSBOX_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          OPSBOX_REQUIRE_IMAGE: "1"
        run: |
          docker pull --quiet "$OPSBOX_IMAGE"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes -r requirements-dev.txt
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q tests/test_image.py
      # The digest, and this architecture's versions.txt for the release.
      - name: Record the build
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          echo "$DIGEST" > "$RUNNER_TEMP/build/digest-$ARCH"
          docker run --rm --entrypoint cat "$IMAGE" /usr/local/share/opsbox/versions.txt \
            > "$RUNNER_TEMP/build/versions-$ARCH.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.arch }}
          path: ${{ runner.temp }}/build/
          if-no-files-found: error
          # A day, so "Re-run failed jobs" can publish these images after a
          # blip. Any later, start a new run: these could take `latest` from
          # whatever was released since, and without them a re-run of `publish`
          # stops at its version step, having tagged nothing.
          retention-days: 1

  # Join the two architectures under the version's tags, then cut the release.
  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the tag and the GitHub release
      packages: write # the image's tags
      id-token: write # sign the provenance attestation
      attestations: write # and store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: ${{ runner.temp }}/build
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version again, from the amd64 image that was actually pushed, so the
      # notes describe what ships rather than what `plan` built minutes earlier.
      # This also asks again whether main has moved on, as it may have since then,
      # and every step after this one is skipped when there's nothing to release.
      #
      # Only amd64 decides. A change that reaches arm64 alone, such as a Debian
      # rebuild for that architecture, ships with the next release amd64 makes;
      # the floating tools move most weeks. The warning below can only fire when
      # a release happens and the two architectures' tools differ.
      #
      # These steps run in the checkout, because plan-release.sh reads the
      # repository's tags.
      - name: Version and notes from the pushed image
        id: version
        env:
          BUILD: ${{ runner.temp }}/build
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version=$(scripts/plan-release.sh --only-if-newest --notes "$BUILD/notes.md" \
            "$image@$(cat "$BUILD/digest-amd64")" "$image")
          if [ -z "$version" ]; then
            echo "::notice::This run releases nothing; this step's log says why."
            exit 0
          fi
          if ! diff <(grep '^tool' "$BUILD/versions-amd64.txt") <(grep '^tool' "$BUILD/versions-arm64.txt"); then
            echo "::warning::amd64 and arm64 carry different tool versions; see the two versions files on the release"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Never replaces a published X.Y.Z; see scripts/publish-image.sh.
      - name: Tag the image
        if: steps.version.outputs.version != ''
        id: tag
        env:
          BUILD: ${{ runner.temp }}/build
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          scripts/publish-image.sh "$image" "$VERSION" \
            "$image@$(cat "$BUILD/digest-amd64")" "$image@$(cat "$BUILD/digest-arm64")"
          digest=$(docker buildx imagetools inspect "$image:${VERSION#v}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Signed provenance for the published image, so anyone can check it came
      # from this workflow and this commit:
      #   gh attestation verify oci://ghcr.io/jarrodruggiero/opsbox:1 -R jarrodruggiero/opsbox \
      #     --signer-workflow jarrodruggiero/opsbox/.github/workflows/release.yml \
      #     --source-ref refs/heads/main
      # Without the last two, an attestation from any workflow on any branch of
      # the repository would pass.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.version.outputs.version != ''
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.tag.outputs.digest }}
          push-to-registry: true

      # A 404, or a 403 "Resource not accessible by integration", means a merge
      # that changed a workflow file landed in the seconds since the version
      # step. The next run on main releases this too, under the next number.
      - name: Create the release
        if: steps.version.outputs.version != ''
        env:
          BUILD: ${{ runner.temp }}/build
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file "$BUILD/notes.md" \
            "$BUILD/versions-amd64.txt" "$BUILD/versions-arm64.txt"
