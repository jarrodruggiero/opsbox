# Version updates. Every merged pull request is released by the Release
# workflow, which numbers the release from what changed, so these PRs are
# the whole of keeping the pinned tools current.
#
# Dependabot reads FROM lines only, which is why every tool with an official
# image has its own stage in the Dockerfile. gh, Claude Code, Helm and the
# Debian packages are not pinned at all: the weekly release build picks them up.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One pull request for the routine drift. A new major version arrives on
      # its own, because it is the one worth reading first, and it makes a minor
      # release rather than a patch.
      minor-and-patch:
        update-types: [minor, patch]
        # These are 0.x, where a minor version is the breaking step (uv 0.13 to
        # 0.14) and makes a minor release. Only their patches join a group; their
        # minors arrive on their own, as anyone else's major does.
        exclude-patterns:
          - astral-sh/uv
          - cilium/cilium-cli
          - koalaman/shellcheck
          - restic/restic
          - terraform-docs/terraform-docs
          - terraform-linters/tflint
      # Keep this list the same as the exclusions above.
      zero-x-patches:
        patterns:
          - astral-sh/uv
          - cilium/cilium-cli
          - koalaman/shellcheck
          - restic/restic
          - terraform-docs/terraform-docs
          - terraform-linters/tflint
        update-types: [patch]
    ignore:
      # Odd-numbered Node.js majors never become LTS. Move to the next even one
      # by hand when it does (Node 28 in October 2027). A wildcard, because
      # Dependabot may name docker.io/library/node either node or library/node.
      - dependency-name: "*node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # The manager page's terminal (xterm.js), vendored into the image. A major
  # version arrives on its own, because it's the one that can break the page.
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
    groups:
      ui:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      test-dependencies:
        patterns: ["*"]
