# An example: run opsbox on any machine with Docker Compose.
#
#   mkdir -m 0700 home && sudo chown 1000:1000 home
#   docker compose up -d
#
# Then open http://<this machine>:8080/ to sign in to Claude and answer the
# trust question (once each); see the README.
#
# Everything personal lives in ./home: Claude Code's sign-in and settings, SSH
# keys, kubeconfig, talosconfig, gh's token, and the repositories you clone
# into ~/workspace. Back it up, and keep it as private as the keys in it.
#
# To update: docker compose pull && docker compose up -d
services:
  opsbox:
    # `1` follows every release of major version 1, tool majors included
    # (they make minor releases). Pin `1.2` to take only patch releases, or
    # `1.2.3` to hold still.
    image: ghcr.io/jarrodruggiero/opsbox:1
    container_name: opsbox
    # The default session name in the Claude app, and stable across updates:
    # without it the hostname is the container's ID, which changes on every
    # `up` after a pull.
    hostname: opsbox
    # The manager restarts Remote Control itself; this restarts the manager.
    restart: unless-stopped
    # The manager page, plain HTTP. This publishes it on every interface, and
    # Docker's published ports go around ufw and firewalld: on anything but a
    # trusted LAN, publish it on one address ("192.168.1.10:8080:8080"), or on
    # 127.0.0.1 behind an HTTPS proxy.
    ports:
      - "8080:8080"
    # For the `remote-control` command (Remote Control without the page),
    # uncomment these, so `docker attach` can reach its trust question:
    # tty: true
    # stdin_open: true
    volumes:
      - ./home:/home/opsbox
    # Nothing in the image needs a capability, a setuid binary, or to write
    # outside its home and the temporary directories. Docker mounts those
    # noexec, so nothing copied into them runs either; tools that need to run
    # something they downloaded keep it under the home directory.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    # To let the box build images, give it a Docker engine of its own (a VM),
    # never this host's: whatever can reach a Docker socket is root on the
    # machine the engine runs on. Point the CLI at the VM over SSH, with a key
    # from ./home/.ssh:
    # environment:
    #   DOCKER_HOST: ssh://builder@build-vm   # or set it on the manager page
    #   OPSBOX_MANAGER_HOSTS: opsbox.home     # names the page answers to, besides IPs
