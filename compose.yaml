# An example: run opsbox on any machine with Docker Compose.
#
#   mkdir -m 0700 home && sudo chown 1000:1000 home
#   docker compose up -d
#   docker exec -it opsbox claude auth login      # once: sign in
#   docker attach opsbox                          # once: the trust question
#
# `docker attach` doesn't replay what was printed before it, so the question
# (visible in `docker logs opsbox`) is already waiting: type y and Enter, then
# detach with Ctrl-P Ctrl-Q.
#
# Everything personal lives in ./home: Claude Code's sign-in and settings, SSH
# keys, kubeconfig, talosconfig, gh's token, and the repositories you clone
# into ~/workspace. Back it up, and keep it as private as the keys in it.
#
# To update: docker compose pull && docker compose up -d
services:
  opsbox:
    # `1` follows every release of major version 1, tool majors included
    # (they make minor releases). Pin `1.2` to take only patch releases, or
    # `1.2.3` to hold still.
    image: ghcr.io/jarrodruggiero/opsbox:1
    container_name: opsbox
    # The default session name in the Claude app, and stable across updates:
    # without it the hostname is the container's ID, which changes on every
    # `up` after a pull.
    hostname: opsbox
    restart: unless-stopped
    # `claude remote-control` waits at a terminal; these let `docker attach`
    # reach it.
    tty: true
    stdin_open: true
    volumes:
      - ./home:/home/opsbox
    # Nothing in the image needs a capability, a setuid binary, or to write
    # outside its home and /tmp.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    # To let the box build images, give it a Docker engine of its own (a VM),
    # never this host's: whatever can reach a Docker socket is root on the
    # machine the engine runs on. Point the CLI at the VM over SSH, with a key
    # from ./home/.ssh:
    # environment:
    #   DOCKER_HOST: ssh://builder@build-vm
